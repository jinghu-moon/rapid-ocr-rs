/* ================= 渲染：诊断面板（复用 timings / 指纹，不重新测量，§7.5/§10.6） ================= */
/* 诊断面板顶部永远先渲染契约错误：字段缺失/改名在这里留痕，
   与 toast 一起构成"可见 + 可查"的两条路径（P2-2）。
   注意即使 state.result 为 null（解析失败）也必须显示这些错误，否则用户只剩一个 toast。 */
function diagContractHtml(){
  if(!state.diag.length) return '';
  return `<div class="diag-sec">契约错误 · 响应字段</div>
    <p class="diag-line">${state.diag.map(x => esc(x)).join('<br>')}</p>
    <p class="diag-note">前端按 src/api.rs 的冻结契约解析响应，不做别名兼容：字段被改名或缺失时
    一律在此点名路径并拒绝渲染，避免把后端改名悄悄吞掉。</p>`;
}
function renderDiag(){
  const d = $('diagBody');
  const head = diagContractHtml();
  if(!state.result){
    d.innerHTML = head + '<p class="diag-line">识别完成后，此处展示逐阶段耗时（时间账本）与运行时指纹。</p>';
    return;
  }
  const t = state.result.timings;
  const rows = Object.entries(t).filter(([k, v]) => typeof v === 'number' && k !== 'total_ms' && k !== 'total');
  const total = t.total_ms != null ? t.total_ms : (t.total != null ? t.total
    : rows.reduce((a, [, v]) => a + v, 0));
  const s = state.status || emptyStatus();
  const fp = s.fingerprint;
  d.innerHTML = head +
    `<div class="diag-sec">逐阶段耗时（MS）</div>
     <table class="diag-table">${rows.map(([k, v]) =>
        `<tr><td>${esc(k)}</td><td>${v.toFixed(1)}</td></tr>`).join('')}
       <tr class="total"><td>total</td><td>${total.toFixed(1)}</td></tr>
     </table>` +
     ledgerHtml() +
     `<div class="diag-sec">PROVIDER 实测</div>
     <p class="diag-line">requested ${esc(s.requested || '未知')} · selected_ep ${esc(s.selected_ep || '未知')}` +
     (s.fallback === true ? ' · 已回退 CPU' : s.fallback === false ? ' · 未回退' : ' · 回退状态未知') +
     ` — 本页任务的实测耗时见上表。</p>` +
     (fp ? `<div class="diag-sec">ORT 指纹</div>
       <p class="diag-line">${esc(fp.file || '')}${fp.size_bytes ? ' · ' + fmtBytes(fp.size_bytes) : ''}` +
       (fp.sha256 ? ' · sha256 ' + esc(String(fp.sha256).slice(0, 16)) + '…' : '') + '</p>' : '') +
     `<div class="diag-sec">运行时与内存</div>
      <p class="diag-line">ORT ${esc(s.ort || '—')} · 峰值工作集 ${s.memory != null ? fmtBytes(s.memory) : '—'}` +
      (s.memorySource ? `（来源：${esc(s.memorySource)}）` : '') + '</p>' +
     `<p class="diag-note">口径说明：以上数据来自引擎内建 timings / stages、库的时间账本与 ORT 指纹，前端不重新测量；
      provider 名称不构成性能结论，请以实测耗时为准。账本的占比只在<b>口径残差</b>的量级内成立，
      残差的含义以下方库原文为准。</p>`;
}

/* 时间账本（库的 TimingLedger）：命名分量 + 口径残差 + **库自己写的**解释文案。
   刻意把 interpretation 原文展示出来——"两个窗口串行、不是重复计时""账本不是严格划分"
   这些话只有库写得准确，前端自己拼一句"仅供参考"会丢掉可核对的口径（§10.6、M3）。 */
function ledgerHtml(){
  const l = state.result && state.result.ledger;
  if(!l) return '';
  const c = l.conservation || {};
  const named = ['total_ms','attributed_ms','input_ms','inference_ms','rust_ms','unattributed_ms']
    .filter(k => typeof l[k] === 'number')
    .map(k => `<tr><td>${esc(k)}</td><td>${l[k].toFixed(1)}</td></tr>`).join('');
  const residual = typeof c.residual_ms === 'number' ? c.residual_ms.toFixed(6) : '—';
  const excess = typeof c.excess_ms === 'number' ? c.excess_ms.toFixed(6) : '—';
  const tol = typeof c.tolerance_ms === 'number' ? c.tolerance_ms.toFixed(6) : '—';
  const verdict = c.conserved === true ? '守恒（在容差内）' : '不守恒（口径差异，不是总量算错）';
  return `<div class="diag-sec">时间账本 · 口径残差（MS，库数据）</div>
    <table class="diag-table">${named}
      <tr><td>residual_ms = attributed − total</td><td>${residual}</td></tr>
      <tr><td>excess_ms = max(0, −residual)</td><td>${excess}</td></tr>
      <tr><td>tolerance_ms</td><td>${tol}</td></tr>
    </table>
    <p class="diag-line">${esc(verdict)}</p>
    <p class="diag-note">${esc(typeof c.interpretation === 'string' ? c.interpretation : '（服务端未提供账本解释文案）')}</p>`;
}

/* ================= 真实模式：status / models 轮询 ================= */
function statusOnce(){
  return apiJson('GET', '/api/status').then(s => {
    state.netFail = false;
    state.status = normalizeStatus(s);
    renderEngine(); renderPill();
  }).catch(e => {
    state.netFail = true; state.status = emptyStatus('failed');
    renderEngine(); renderPill();
  });
}
function statusLoop(){
  statusOnce().then(() => {
    setTimeout(statusLoop, state.status.state === 'ready' ? 8000 : 2000);
  }).catch(() => setTimeout(statusLoop, 5000));
}
function refreshModels(){
  if(DEMO){ renderBanner(); renderButton(); renderFormulaToggle(); renderEngine(); return Promise.resolve(); }
  return apiJson('GET', '/api/models').then(m => {
    state.models = normalizeModels(m);
    /* 模型集状态一变，三处结论都要跟着重算：横幅（按集合下载）、提交门禁（文本队列）、
       公式开关（公式队列）——公式缺失不得阻塞文本队列，反之亦然。 */
    renderBanner(); renderButton(); renderFormulaToggle(); renderEngine();
  }).catch(e => {
    state.models = { error:e };
    renderBanner(); renderButton(); renderFormulaToggle(); renderEngine();
  });
}

/* ================================================================
   离线预览模式（占位符未被 serve 替换时启用，页面顶部有常驻标识）
   ================================================================ */
function demoStatusData(){
  const ready = demo.phase === 'ready';
  const ph = demoPhaseFromModels();
  return {
    engine:{ state: ph === 'waitmodels' ? 'waiting_models'
             : ph === 'building' ? 'loading'
             : ph === 'ready' ? 'ready' : 'loading' },
    /* §7.5 三字段必须齐全。离线预览刻意给一个真实场景：请求 directml 但会话回退到 CPU，
       以便直接看到回退高亮、警示文案与"已回退 CPU"标签（缺失字段则渲染为「未知」）。 */
    provider:{ requested:'directml', selected_ep:'CPUExecutionProvider', fallback_to_cpu:true },
    ort:{ version:'1.20.1', fingerprint:null },
    memory:{ peak_working_set_bytes: ready ? 537395200 : 81234567 },
    queues:{ text:{ used: (state.job && state.job.state === 'queued') ? 1 : 0, capacity:4 },
             formula:{ used:0, capacity:2 } }
  };
}
function demoSetStatus(){
  state.status = normalizeStatus(demoStatusData());
  renderEngine(); renderPill();
}
function demoInitialModels(){
  /* 离线预览必须能看出"文本就绪 / 公式缺失"这个区分，因此刻意给两个集合：
       · PP-OCRv5（演示）        → **齐备**（detector + recognizer + dictionary 全 present）
       · PP-FormulaNet（演示）   → **不齐备**（566 MB 公式模型 missing，且带 source_url）
     与 docs/05 一致：公式模型默认不下载（§10.8），普通 OCR 不依赖它（M4 公式独立）。 */
  return normalizeModels({
    model_dir:'<redacted>', source:'default_table', downloads_allowed:true,
    sets:[
      { id:'PP-OCRv5（演示）', complete:true, download_bytes_total:0,
        files:[
          { name:'PP-OCRv5_server_det.onnx', role:'detector',   state:'present', size_bytes:4940000, sha256:'8f3ac21d90e…', source_url:'https://paddleocr.bj.bcebos.com/PP-OCRv5/server/det.onnx' },
          { name:'PP-OCRv5_server_rec.onnx', role:'recognizer', state:'present', size_bytes:8010000, sha256:'c71b0f4a22e…', source_url:'https://paddleocr.bj.bcebos.com/PP-OCRv5/server/rec.onnx' },
          { name:'ppocrv5_dict.txt',         role:'dictionary', state:'present', size_bytes:126469,  sha256:'a2d9c8e710b…', source_url:'https://paddleocr.bj.bcebos.com/PP-OCRv5/server/dict.txt' }
        ] },
      { id:'PP-FormulaNet（演示）', complete:false, download_bytes_total:566231040,
        files:[
          { name:'pp_formulanet_plus_m.onnx', role:'formula_recognizer', state:'missing', size_bytes:566231040, sha256:'d4e8f0b31c2…', source_url:'https://www.modelscope.cn/models/RapidAI/RapidOCR/resolve/master/pp_formulanet_plus_m.onnx' }
        ] }
    ]
  });
}
/* 演示模式的引擎相位由**文本集合是否齐备**决定（与真实模式同一判据），
   因此公式集合缺失不会把引擎状态压成 waiting_models。 */
function demoPhaseFromModels(){
  if(demo.phase === 'boot') return 'boot';
  if(demo.phase === 'building') return 'building';
  const t = modelsReadyFor('text');
  if(t.fatal || !t.ready) return 'waitmodels';
  return demo.phase === 'ready' ? 'ready' : 'waitmodels';
}
async function enterDemo(){
  $('demoStrip').hidden = false;
  demo.phase = 'boot'; demoSetStatus();
  await sleep(1100);
  demo.phase = 'waitmodels';
  state.models = demoInitialModels();
  demo.textReady = modelsReadyFor('text').ready;
  demoSetStatus(); renderBanner(); renderButton(); renderFormulaToggle();
}
/* 离线预览的下载：与真实模式**共用同一套 job 生命周期**——
   先建 job（拿到 job_id），进度来自 job 的 state/elapsed，取消走同一 cancelDownload()。
   下载只作用于被点击的那个集合（setId），绝不落到 sets[0]。 */
async function demoDownload(setId){
  const set = state.models.sets.find(s => s.id === setId);
  if(!set) return toast(`模型集 ${setId} 不存在`, 'err', 'cloud-off');
  demo.dlActive = true; demo.dlSetId = setId;
  const jobId = 'demo-dl-' + Math.random().toString(36).slice(2, 8);
  state.dlSetId = setId;
  state.dlJob = { id: jobId, set_id: setId, state:'queued', elapsed_ms:0 };
  renderBanner();
  await sleep(300);
  state.dlJob.state = 'running';
  const t0 = performance.now();
  for(const f of set.files){
    if(!state.dlJob) return;                      /* 已被取消 */
    if(f.state === 'present') continue;
    demo.dlFile = f.name; let p = 0;
    while(p < 100){
      if(!state.dlJob) return;                    /* 文件边界取消（§6.6） */
      p = Math.min(100, p + 2 + Math.random() * 7);
      demo.dlPct = p;
      state.dlJob.elapsed_ms = performance.now() - t0;
      renderBanner();
      await sleep(65);
    }
    f.state = 'present';
  }
  demo.dlActive = false; demo.dlSetId = null;
  set.complete = set.files.every(f => f.state === 'present');
  set.bytes = set.files.filter(f => f.state !== 'present').reduce((a, f) => a + (f.size || 0), 0);
  const finishedId = state.dlJob.id;
  state.dlJob = null; state.dlSetId = null;
  demo.textReady = modelsReadyFor('text').ready;
  renderBanner(); renderButton(); renderFormulaToggle();
  toast(`模型集「${setId}」下载完成（job ${finishedId}），引擎将在下次识别时惰性创建`, 'ok', 'package');
  if(modelsReadyFor('text').ready){
    demo.phase = 'building'; demoSetStatus();
    await sleep(demo.buildMs);
    demo.phase = 'ready'; demoSetStatus(); renderButton();
    toast(`引擎创建完成 · 耗时 ${(demo.buildMs/1000).toFixed(1)} s`, 'ok');
  }
}
async function demoUpload(){
  state.uploading = true; showUp(true); setUpProgress(0);
  renderButton(); drop.classList.add('no-click');
  demo.upAbort = false;
  let p = 0;
  while(p < 100){
    if(demo.upAbort) break;
    p = Math.min(100, p + 4 + Math.random() * 11);
    setUpProgress(p / 100);
    await sleep(70 + Math.random() * 70);
  }
  state.uploading = false; showUp(false);
  drop.classList.remove('no-click'); renderButton();
  if(demo.upAbort){ toast('已取消上传', 'err', 'info'); return; }
  await sleep(240);   /* 模拟 202 往返 */
  clearResult(false);
  state.job = { id:'demo-' + Math.random().toString(36).slice(2, 8), kind:'text',
                queue:'text', state:'queued', position:1, queued_ms:0, elapsed_ms:0 };
  toast('任务已提交（202）', 'ok');
  renderJob(); renderButton(); scanOn();
  await sleep(850);
  if(!state.job || state.job.state !== 'queued') return;   /* 排队阶段被取消 */
  state.job.state = 'running'; renderJob();
  const t0 = performance.now();
  while(performance.now() - t0 < 2500){
    if(!state.job || state.job.state !== 'running') return;
    state.job.elapsed_ms = performance.now() - t0;
    renderJob();
    await sleep(180);
  }
  state.job.state = 'succeeded';
  state.result = demoResult(state.image.w, state.image.h);
  finishJob();
}
/* 演示区域：按上传图实际尺寸的相对布局生成，保证叠框在任何图上都成立 */
function demoResult(w, h){
  const rows = [
    ['发票代码：144032257110', .982],
    ['开票日期：2024-06-18', .976],
    ['购方名称：本地评估科技有限公司', .964],
    ['合计金额（大写）壹仟贰佰捌拾元整', .971],
    ['E = mc^{2}', .913, 'formula'],
    ['备注：本行由离线预览数据填充', .887]
  ];
  const regions = rows.map((r, i) => {
    const x0 = Math.round(w * .10);
    const x1 = Math.round(w * (.58 + .05 * (i % 3)));
    const y0 = Math.round(h * (.14 + .115 * i));
    const y1 = y0 + Math.max(14, Math.round(h * .055));
    return { text:r[0], conf:r[1], kind:r[2] || 'text', order:i + 1,
             polygon:[[x0,y0],[x1,y0],[x1,y1],[x0,y1]] };
  });
  return {
    regions,
    plain: rows.map(r => r[0]).join('\n'),
    timings:{ preprocess_ms:14.2, det_ms:412.8, cls_ms:8.4, rec_ms:236.5, postprocess_ms:3.1, total_ms:675.0 }
  };
}
/* 演示模式：标注图 = 原图 + 当前叠框，本地合成 PNG */
function demoAnnotated(){
  const i = state.image;
  if(!i || !state.result) return;
  const c = document.createElement('canvas');
  c.width = i.w; c.height = i.h;
  const g = c.getContext('2d');
  g.drawImage(imgEl, 0, 0);
  state.result.regions.forEach(r => {
    if(!r.polygon) return;
    g.beginPath();
    g.moveTo(r.polygon[0][0], r.polygon[0][1]);
    for(let k = 1; k < r.polygon.length; k++) g.lineTo(r.polygon[k][0], r.polygon[k][1]);
    g.closePath();
    g.setLineDash(r.kind === 'formula' ? [8,6] : []);
    g.lineWidth = Math.max(2, i.w / 500);
    g.strokeStyle = '#111';
    g.stroke();
  });
  c.toBlob(b => { saveBlob(b, 'ocr-' + state.job.id + '-annotated.png'); toast('标注图已保存', 'ok', 'download'); });
}
/* 演示模式导出：JSON / Markdown / 静态 HTML（无脚本，呼应 ReportMode::Static 口径） */
function demoExport(fmt){
  const r = state.result, id = state.job.id;
  let blob, name;
  if(fmt === 'json'){
    blob = new Blob([JSON.stringify(r.raw && Object.keys(r.raw).length ? r.raw : {
      job_id:id, plain_text:r.plain, regions:r.regions, timings:r.timings
    }, null, 2)], { type:'application/json' });
  } else if(fmt === 'md'){
    const md = ['# OCR 识别结果', '', '- 任务：`' + id + '`', '- 区域数：' + r.regions.length, '',
      '| # | 类型 | 置信度 | 文本 |', '|---|---|---|---|',
      ...r.regions.map((g, i) => `| ${i+1} | ${g.kind === 'formula' ? '公式' : '文本'} | ` +
        `${g.conf != null ? (g.conf > 1 ? g.conf : g.conf*100).toFixed(1) + '%' : '—'} | ${g.text.replace(/\|/g,'\\|')} |`)].join('\n');
    blob = new Blob([md], { type:'text/markdown' });
  } else {
    const html = '<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><title>OCR ' + esc(id) + '</title>' +
      '<style>body{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;max-width:760px;margin:40px auto;' +
      'padding:0 20px;color:#111;background:#fafafa}h1{font-size:20px}table{border-collapse:collapse;width:100%;' +
      'font-size:14px}td,th{border-bottom:1px solid #ddd;padding:8px 6px;text-align:left}th{font-size:12px;' +
      'color:#666;letter-spacing:.1em}small{color:#888}</style></head><body><h1>OCR 识别结果</h1><p><small>' +
      esc(id) + ' · ' + r.regions.length + ' 个区域 · 由 RapidOCR 本地评估台导出</small></p><table><tr><th>#</th><th>类型</th><th>置信度</th><th>文本</th></tr>' +
      r.regions.map((g, i) => '<tr><td>' + (i+1) + '</td><td>' + (g.kind === 'formula' ? '公式' : '文本') + '</td><td>' +
        (g.conf != null ? (g.conf > 1 ? g.conf : g.conf*100).toFixed(1) + '%' : '—') + '</td><td>' + esc(g.text) + '</td></tr>').join('') +
      '</table></body></html>';
    blob = new Blob([html], { type:'text/html' });
  }
  saveBlob(blob, 'ocr-' + id + '.' + fmt);
  toast(fmt.toUpperCase() + ' 导出已保存', 'ok', 'download');
}

/* ================= 启动 ================= */
/* 队列就绪 / 公式开关都依赖 /api/models，因此在取到模型集之前先按"未知"渲染一遍，
   取到之后由 refreshModels() 重算（离线预览则由 enterDemo() 负责）。 */
renderPill(); renderEngine(); renderRegions(); renderDiag(); renderButton(); renderFormulaToggle();
if(DEMO){
  enterDemo();
}else{
  statusLoop();        /* 引擎状态：loading 期 2s，ready 后 8s */
  refreshModels();     /* 模型集状态；下载任务的进度由 GET /api/jobs/{id} 轮询 */
}
})();
</script>
